plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// Release builds use key.properties when it's present. Local checkouts and PR CI don't
// have it, and without this they can't do a release build at all: signingConfigs.release
// gets a null storeFile and gradle fails configuration with "Keystore file not set for
// signing config release". Those fall back to debug signing, see buildTypes.release.
def hasReleaseKeystore = keystorePropertiesFile.exists() && keystoreProperties['storeFile']

// Set by the release workflows. A debug-signed build can't update a Play install and
// shouldn't reach users, so if the artifact is going to be published a missing or
// malformed key.properties needs to fail rather than quietly downgrade.
if (System.getenv('BB_REQUIRE_RELEASE_SIGNING') == 'true' && !hasReleaseKeystore) {
    throw new GradleException(
        'BB_REQUIRE_RELEASE_SIGNING is set, but android/key.properties is missing or has no ' +
        'storeFile entry. Refusing to fall back to debug signing for a release build.')
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace "com.bluebubbles.messaging"
    compileSdk 36
    ndkVersion = "28.2.13676358"

    // Already the default on AGP 8, but AGP 9 flips resValues to false. The product flavors
    // below declare resValue entries (app_name_en, ic_launcher_background, file_provider),
    // so stating it explicitly keeps configuration working across that bump.
    buildFeatures {
        resValues = true
    }

    lintOptions {
        checkReleaseBuilds false
        disable 'InvalidPackage'
    }

    aaptOptions {
        noCompress "tflite"
    }

    defaultConfig {
        applicationId "com.bluebubbles.messaging"
        minSdkVersion 26
        targetSdkVersion 36
        versionCode 20002000 + flutterVersionCode.toInteger()
        versionName flutterVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = '21'
    }

    // Fix for META-INF/versions/9/OSGI-INF/MANIFEST.MF duplicate file error
    // This is a known issue with the latest version of OkHttp.
    packaging {
        resources {
            excludes += ['META-INF/versions/9/OSGI-INF/MANIFEST.MF']
        }
    }

    signingConfigs {
        // Left empty when key.properties is absent, so that configuration succeeds and
        // buildTypes.release below can point the shipping flavors at debug signing.
        release {
            if (hasReleaseKeystore) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
        debug {

        }
    }

    flavorDimensions = ["app"]

    productFlavors {
        joel {
            dimension "app"
            resValue "string", "app_name_en", "BlueBubbles Dev (Joel)"
            resValue "color", "ic_launcher_background", "#4c49de"
            resValue "string", "file_provider", "com.bluebubbles.messaging.joel.fileprovider"
            applicationId "com.bluebubbles.messaging.joel"
        }
        tanay {
            dimension "app"
            resValue "string", "app_name_en", "BlueBubbles (Tanay Special Sauce)"
            resValue "color", "ic_launcher_background", "#4c49de"
            resValue "string", "file_provider", "com.bluebubbles.messaging.tanay.fileprovider"
            applicationId "com.bluebubbles.messaging.tanay"
        }
        alpha {
            dimension "app"
            resValue "string", "app_name_en", "BlueBubbles (Alpha)"
            resValue "color", "ic_launcher_background", "#49dbde"
            resValue "string", "file_provider", "com.bluebubbles.messaging.alpha.fileprovider"
            applicationId "com.bluebubbles.messaging.alpha"
        }
        beta {
            dimension "app"
            resValue "string", "app_name_en", "BlueBubbles (Beta)"
            resValue "color", "ic_launcher_background", "#4990de"
            resValue "string", "file_provider", "com.bluebubbles.messaging.beta.fileprovider"
            applicationId "com.bluebubbles.messaging.beta"
        }
        prod {
            getIsDefault().set(true)
            dimension "app"
            resValue "string", "app_name_en", "BlueBubbles"
            resValue "color", "ic_launcher_background", "#4990de"
            resValue "string", "file_provider", "com.bluebubbles.messaging.fileprovider"
            applicationId "com.bluebubbles.messaging"
        }
        prodNoAa {
            dimension "app"
            resValue "string", "app_name_en", "BlueBubbles"
            resValue "color", "ic_launcher_background", "#4990de"
            resValue "string", "file_provider", "com.bluebubbles.messaging.fileprovider"
            applicationId "com.bluebubbles.messaging"
        }
    }

    buildTypes {
        release {
            // No keystore means the shipping flavors sign with the debug key, which is
            // enough to prove the release build compiles. BB_REQUIRE_RELEASE_SIGNING
            // stops anything publishable from taking this path.
            def releaseSigning = hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
            productFlavors.joel.signingConfig signingConfigs.debug
            productFlavors.tanay.signingConfig signingConfigs.debug
            productFlavors.alpha.signingConfig releaseSigning
            productFlavors.beta.signingConfig releaseSigning
            productFlavors.prod.signingConfig releaseSigning
            productFlavors.prodNoAa.signingConfig releaseSigning
            minifyEnabled false
            shrinkResources false
        }
    }
    sourceSets {
        main {
            java {
                srcDirs 'src/main/java', 'src/main/java/workers'
            }
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    // Android native functions
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.sharetarget:sharetarget:1.2.0"
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'androidx.activity:activity-ktx:1.9.1'
    implementation "androidx.work:work-runtime:2.9.0"
    implementation "androidx.concurrent:concurrent-futures-ktx:1.2.0"

    // Firebase items
    implementation 'com.google.firebase:firebase-messaging:24.0.0'
    implementation 'com.google.firebase:firebase-database:21.0.0'
    implementation 'com.google.firebase:firebase-messaging-directboot:24.0.0'
    implementation 'com.google.firebase:firebase-iid:21.1.0'
    implementation 'com.google.firebase:firebase-firestore:25.0.0'

    // Kotlin Coroutines (async)
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.8.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-guava:1.8.1"

    // Socket IO
    implementation ('io.socket:socket.io-client:2.1.1') {
        // excluding org.json which is provided by Android
        exclude group: 'org.json', module: 'json'
    }

    // JSON parsing
    implementation 'com.google.code.gson:gson:2.10.1'

    // HTTP Client (OkHttp + Retrofit)
    implementation 'com.squareup.okhttp3:okhttp:5.3.2'
    implementation 'com.squareup.okhttp3:logging-interceptor:5.3.2'
    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'

    // For AGP 7.4+ desugaring
    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")

    implementation 'org.unifiedpush.android:connector:2.5.0'
}
