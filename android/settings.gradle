pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    // AGP 9 runs with android.builtInKotlin=false (gradle.properties) because most plugins
    // still apply kotlin-android, which built-in Kotlin rejects. KGP must stay declared here
    // so Flutter can apply it to plugins that don't. See android/CLAUDE.md.
    id "com.android.application" version "9.4.1" apply false
    id "com.android.library" version "9.4.1" apply false
    id "org.jetbrains.kotlin.android" version "2.4.20" apply false
    id "com.google.gms.google-services" version "4.4.1" apply false
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

include ":app"