allprojects {
    repositories {
        google()
        maven { url "https://jitpack.io" }
        maven { url "https://maven.google.com" }
        mavenCentral()
    }
}

// Project.buildDir is deprecated and slated for removal in Gradle 10 — it returns a
// non-lazy File, so plugins that read it before this reassignment land on the wrong path.
// layout.buildDirectory is the lazy equivalent and resolves to the same directories.
rootProject.layout.buildDirectory.set(rootProject.layout.projectDirectory.dir("../build"))
subprojects {
    project.layout.buildDirectory.set(rootProject.layout.buildDirectory.dir(project.name))
}
subprojects {
    project.evaluationDependsOn(':app')
}

// Some transitive dependencies (e.g. unifiedpush_android) ship a Kotlin
// languageVersion of 1.7, which the project's Kotlin Gradle plugin no longer
// supports. Force a minimum supported language version across all modules.
subprojects {
    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        compilerOptions {
            languageVersion.set(org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_1_8)
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}

