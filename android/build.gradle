allprojects {
    repositories {
        google()
        maven { url "https://jitpack.io" }
        maven { url "https://maven.google.com" }
        mavenCentral()
    }
}

// Project.buildDir is deprecated and slated for removal in Gradle 10 — it returns a
// non-lazy File, so plugins that read it before this reassignment land on the wrong path.
// layout.buildDirectory is the lazy equivalent and resolves to the same directories.
rootProject.layout.buildDirectory.set(rootProject.layout.projectDirectory.dir("../build"))
subprojects {
    project.layout.buildDirectory.set(rootProject.layout.buildDirectory.dir(project.name))
}
subprojects {
    project.evaluationDependsOn(':app')
}

// file_picker 11.x skips applying KGP on AGP 9+ and expects built-in Kotlin to compile its
// sources, but builtInKotlin has to stay off while most plugins still apply kotlin-android.
// Flutter's shim (applies KGP to plugins that lack it) misses this one: it detects KGP by
// text-matching the build file, and file_picker's `apply plugin` line sits behind an `if`.
// Drop this once file_picker is upgraded or builtInKotlin can be turned on.
subprojects {
    if (name == 'file_picker') {
        pluginManager.withPlugin('com.android.library') {
            pluginManager.apply('org.jetbrains.kotlin.android')
            // Its kotlinOptions block is behind the same AGP 9 check; match its Java target.
            tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                compilerOptions {
                    jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
                }
            }
        }
    }
}

// Some plugins (e.g. unifiedpush_android) pin an old Kotlin languageVersion that the
// project's Kotlin Gradle plugin no longer supports. Force the oldest version KGP 2.4
// still accepts (2.0) across all modules.
subprojects {
    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        compilerOptions {
            languageVersion.set(org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_2_0)
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}

