name: Android Builds

# Builds the two Android release artifacts from one tag:
#
#   * prod      -> universal APK, attached to the GitHub release. Android Auto is
#                  included here; sideloaders opt into it via unknown sources.
#   * prodNoAa  -> app bundle for the Play Store. The prodNoAa source set removes the
#                  com.google.android.gms.car.application meta-data via the manifest
#                  merger, so the store build ships without Android Auto.
#
# The bundle is uploaded as a workflow artifact only — it is never attached to a
# release. Play Store submission stays manual (same posture as the store msix in
# desktop-builds.yml).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Matches the pin in windows/build.ps1, linux/build.sh and the other workflows.
  FLUTTER_VERSION: "3.44.6"
  # Pinned by android/app/build.gradle; the runner image does not always carry it.
  ANDROID_NDK_VERSION: "28.2.13676358"
  # android/app/build.gradle compileSdk.
  ANDROID_COMPILE_SDK: "36"
  # android/app/build.gradle compileOptions / kotlinOptions.
  JAVA_VERSION: "21"

jobs:
  build:
    # Needed by the release attach step on the apk leg.
    permissions:
      contents: write
    # Gate for the signing key. Holding the keystore secrets in this environment
    # (rather than as plain repo secrets) means a workflow pushed to some other branch
    # cannot reach them, and adding a required reviewer under Settings > Environments
    # forces a human to approve every run that touches the release key.
    environment: android-release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: prod
            target: apk
            ext: apk
            # Gradle's own outputs/apk/ copy is ignored — flutter mirrors the APK here.
            outdir: build/app/outputs/flutter-apk
            artifact: bluebubbles-android-apk
            filename: bluebubbles-app-prod-release.apk
          - flavor: prodNoAa
            target: appbundle
            ext: aab
            outdir: build/app/outputs/bundle
            artifact: bluebubbles-android-aab-store
            filename: bluebubbles-app-prodNoAa-release.aab
    steps:
      # persist-credentials: false — nothing here pushes, and the default leaves the
      # GITHUB_TOKEN sitting in .git/config where any build step (a gradle plugin, a
      # pub package's build hook) could read it back out.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # AGP can auto-download SDK components, but the pinned NDK is a 2GB fetch that
      # fails deep inside a Gradle task when it goes wrong. Install it up front so a
      # missing component surfaces as its own step.
      - name: Install Android SDK components
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" --install \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "ndk;${ANDROID_NDK_VERSION}"

      # No fvm here — the Android build has no reason to switch SDKs mid-job, so this
      # uses the standard Flutter setup action against the same pinned version.
      #
      # Deliberately NOT caching the SDK, pub or gradle in this workflow, and not
      # setting this action's own `cache` input. This is the job that signs and
      # publishes a release binary, and a cache entry is mutable state that never
      # appears in git history — a poisoned blob would silently end up inside a signed
      # APK with nothing in the commit log to review. Tag builds are rare, so re-
      # fetching from upstream every time is worth the few minutes. (The action's
      # `cache` input is also worth avoiding on its own: it delegates to a floating
      # actions/cache@v3 reference inside the action.)
      - name: Setup Flutter
        uses: subosito/flutter-action@1508160852fb97248640997f7cfb38da241df0ba
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Pub get
        run: flutter pub get --enforce-lockfile

      # .env is a declared asset in pubspec.yaml — the build fails outright if it is
      # missing. Passed through env rather than interpolated into the script, so the
      # value can never be parsed as shell.
      - name: Write .env
        env:
          KLIPY_API_KEY: ${{ secrets.KLIPY_API_KEY }}
        run: printf 'KLIPY_API_KEY=%s\n' "$KLIPY_API_KEY" > .env

      # android/app/build.gradle reads android/key.properties and wires the release
      # signing config into every flavor's release build type, so both artifacts need
      # it. storeFile is written absolute — Gradle resolves a relative one against
      # android/app/, not the repo root.
      - name: Write signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. This workflow needs the release keystore in repository secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD."
            exit 1
          fi
          keystore="$RUNNER_TEMP/release-keystore.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$keystore"

          # java.util.Properties treats a backslash as an escape character.
          esc() { printf '%s' "$1" | sed 's/\\/\\\\/g'; }
          {
            echo "storeFile=$(esc "$keystore")"
            echo "storePassword=$(esc "$KEYSTORE_PASSWORD")"
            echo "keyAlias=$(esc "$KEY_ALIAS")"
            echo "keyPassword=$(esc "$KEY_PASSWORD")"
          } > android/key.properties

      # --no-pub: reuse the lockfile-enforced resolution from the Pub get step.
      # flutter build also refreshes android/local.properties with flutter.versionCode
      # from pubspec.yaml, which build.gradle folds into the final versionCode —
      # so this must go through the flutter tool, never a bare gradlew invocation.
      - name: Build ${{ matrix.target }} (${{ matrix.flavor }})
        run: flutter build ${{ matrix.target }} --release --flavor ${{ matrix.flavor }} --no-pub

      # The keystore is only needed by the gradle build above. Drop it before any
      # third-party action runs, so a compromised upload/release action cannot read it
      # off the workspace.
      - name: Remove signing material
        if: always()
        run: |
          rm -f android/key.properties "$RUNNER_TEMP/release-keystore.jks"

      # Flutter lower-cases the flavor in APK filenames but not in bundle paths, and that
      # has shifted between versions — so find the artifact instead of hardcoding a name.
      # Only one variant is built per job, so exactly one file should match.
      - name: Collect artifact
        run: |
          mapfile -t found < <(find "${{ matrix.outdir }}" -type f -name "*.${{ matrix.ext }}")
          if [ "${#found[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one .${{ matrix.ext }} under ${{ matrix.outdir }}, found ${#found[@]}: ${found[*]}"
            echo "Everything flutter actually produced:"
            find build/app/outputs -type f \( -name '*.apk' -o -name '*.aab' \) || true
            exit 1
          fi
          mkdir -p out
          cp "${found[0]}" "out/${{ matrix.filename }}"

          {
            echo "### ${{ matrix.filename }}"
            echo ""
            echo "- flavor: \`${{ matrix.flavor }}\`"
            echo "- version: \`$(grep '^flutter.versionName=' android/local.properties | cut -d= -f2-)\`"
            echo "- size: $(du -h "out/${{ matrix.filename }}" | cut -f1)"
            echo "- sha256: \`$(sha256sum "out/${{ matrix.filename }}" | cut -d' ' -f1)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.artifact }}
          path: out/${{ matrix.filename }}

      # APK only. The bundle is for the Play Store and stays a workflow artifact.
      #
      # Only fires when github.ref is a tag — note that covers a manual run launched
      # against a tag from the Run workflow picker, not just a tag push.
      #
      # draft: true is load-bearing, for two reasons. Without it the action publishes
      # the release as soon as this upload finishes, and since the android build beats
      # the SignPath round trip in desktop-builds.yml that would push the release live
      # before the Windows installer and msix were attached. It also caps the blast
      # radius of a mistaken run: the worst case is an extra asset on a draft rather
      # than a public release nobody meant to cut.
      - name: Attach APK to release
        if: ${{ matrix.target == 'apk' && startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          files: out/${{ matrix.filename }}
          draft: true
