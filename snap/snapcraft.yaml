name: bluebubbles
title: BlueBubbles
version: 2.1.0.0
summary: BlueBubbles client for Linux
description: BlueBubbles is an open-source and cross-platform ecosystem of apps aimed to bring iMessage to Android, Windows, Linux, and more! With BlueBubbles, you'll be able to send messages, media, and much more to your friends and family.
license: Apache-2.0
website: https://bluebubbles.app
source-code: https://github.com/BlueBubblesApp/bluebubbles-app
issues: https://github.com/BlueBubblesApp/bluebubbles-app/issues
donation: https://bluebubbles.app/donate
contact: https://discord.gg/6nrGRHT
confinement: strict
base: core24
grade: stable

platforms:
  amd64:
  arm64:

layout:
  /usr/share/libdrm:
    bind: $SNAP/graphics/libdrm
  /usr/share/drirc.d:
    symlink: $SNAP/graphics/drirc.d
  /usr/share/X11/XErrorDB:
    symlink: $SNAP/graphics/X11/XErrorDB
  /usr/share/X11/locale:
    symlink: $SNAP/graphics/X11/locale
  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/webkit2gtk-4.1:
    bind: $SNAP/gnome-platform/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/webkit2gtk-4.1
  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/alsa-lib:
    bind: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/alsa-lib
  /usr/share/alsa:
    bind: $SNAP/usr/share/alsa

apps:
  bluebubbles:
    command: bin/bluebubbles
    command-chain:
      - bin/gpu-2404-wrapper
      - snap/command-chain/alsa-launch
    extensions:
      - gnome
    slots:
      - dbus-bluebubbles
    plugs:
      - network
      - network-manager
      - camera
      - desktop
      - desktop-legacy
      - wayland
      - x11
      - unity7
      - opengl
      - alsa
      - audio-playback
      - audio-record
    environment:
      LD_LIBRARY_PATH: $LD_LIBRARY_PATH:$SNAP/bin/lib:$SNAP/gnome-platform/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/blas:$SNAP/gnome-platform/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/lapack
      ALWAYS_USE_PULSEAUDIO: '1'
      GIO_USE_PROXY_RESOLVER: libproxy

parts:
  alsa-mixin:
    plugin: dump
    source: https://github.com/diddlesnaps/snapcraft-alsa.git
    source-subdir: snapcraft-assets
    build-packages:
      - libasound2-dev
    stage-packages:
      - libasound2-plugins
      - yad
    stage:
      - etc/asound.conf
      - snap/command-chain/alsa-launch
      - usr/bin/yad
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/alsa-lib
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libasound*
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libFLAC*
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libjack.so*
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libpulse*
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libsamplerate*
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libspeex*
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libvorbis*
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/pulseaudio

  bluebubbles:
    after:
      - alsa-mixin
    source:
      - on amd64: https://github.com/BlueBubblesApp/bluebubbles-app/releases/download/v2.1.0%2B90/bluebubbles-linux-x86_64.tar.gz
      - on arm64: https://github.com/BlueBubblesApp/bluebubbles-app/releases/download/v2.1.0%2B90/bluebubbles-linux-aarch64.tar.gz
    plugin: nil
    override-build: |
      set -eux
      mkdir -p $CRAFT_PART_INSTALL/bin
      cp -r ./* $CRAFT_PART_INSTALL/bin/
    stage-packages:
      - ffmpeg
      - libayatana-appindicator3-1
      - libmpv2
      - libproxy1v5
      - pulseaudio-utils
      - wmctrl
    stage:
      - -usr/bin/ffplay
      - -usr/bin/ffprobe
      - -usr/bin/qt-faststart
      - -usr/share/libmysofa
      - -usr/share/doc
      - -usr/share/man
      - -usr/share/lintian
      - -usr/share/bug
      - -usr/share/icons/Adwaita
      - -usr/share/icons/Humanity*
      - -usr/share/icons/ubuntu-mono*
      - -usr/share/icons/LoginIcons
      - -usr/lib/*/libflite_cmu_time_awb*
      - -usr/lib/*/libflite_cmu_grapheme*
      - -usr/lib/*/libflite_cmu_indic*
      - -usr/lib/*/liblua5.2*
      - -usr/lib/*/libmujs*
      - -usr/lib/*/libsixel*
      - -usr/lib/*/libuchardet*
      - -usr/lib/*/libdvdnav*
      - -usr/lib/*/libdvdread*
      - -usr/lib/*/libpsl*
      - -usr/lib/*/libpixman-1*
      - -usr/lib/*/libfftw3_threads*
      - -usr/lib/*/libfftw3_omp*
      - -usr/lib/*/libsphinxad*
      - -usr/lib/*/libjacknet*
      - -usr/lib/*/libjackserver*
      - -usr/lib/*/libasound*
      - -usr/lib/*/libmpv.so*
      - -usr/lib/*/libgtk-3*
      - -usr/lib/*/libgdk-3*
      - -usr/lib/*/libgdk_pixbuf-2.0*
      - -usr/lib/*/gdk-pixbuf-2.0/**
      - -usr/lib/*/librsvg-2*
      - -usr/lib/*/libpango*
      - -usr/lib/*/libcairo*
      - -usr/lib/*/libharfbuzz*

  mpv:
    plugin: meson
    source: https://github.com/mpv-player/mpv.git
    source-tag: v0.41.0
    source-depth: 1
    meson-parameters:
      - --prefix=/usr
      - -Dlibmpv=true
      - -Dcplayer=false
      - -Dmanpage-build=disabled
      - -Dalsa=disabled
      - -Db_ndebug=true
    build-packages:
      - pkg-config
      - libavcodec-dev
      - libavfilter-dev
      - libavformat-dev
      - libavutil-dev
      - libswresample-dev
      - libswscale-dev
      - libass-dev
      - libplacebo-dev
      - libdrm-dev
      - libegl1-mesa-dev
      - libgbm-dev
      - libgl-dev
      - libx11-dev
      - libxext-dev
      - libxkbcommon-dev
      - libxpresent-dev
      - libxrandr-dev
      - libxss-dev
      - libxv-dev
      - libpulse-dev
      - libjpeg-dev
    prime:
      - usr/lib/*/libmpv.so*
      - usr/lib/libmpv.so*

  gpu-2404:
    after:
      - bluebubbles
    source: https://github.com/canonical/gpu-snap.git
    plugin: dump
    override-prime: |
      craftctl default
      ${CRAFT_PART_SRC}/bin/gpu-2404-cleanup mesa-2404 nvidia-2404
    prime:
      - bin/gpu-2404-wrapper

  cleanup:
    after:
      - bluebubbles
    plugin: nil
    build-snaps:
      - core24
      - gnome-46-2404
      - gtk-common-themes
    override-prime: |
      set -eux
      for snap in "core24" "gnome-46-2404" "gtk-common-themes"; do
          cd "/snap/$snap/current" && find . -type f,l -exec rm -f "$SNAPCRAFT_PRIME/{}" \;
      done

slots:
  dbus-bluebubbles:
    interface: dbus
    bus: session
    name: app.bluebubbles.BlueBubbles
